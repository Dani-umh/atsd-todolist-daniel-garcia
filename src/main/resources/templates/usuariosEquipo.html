<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios del equipo')"></head>

<body>
<div th:replace="fragments :: navbar (usuario=${usuario})"></div>

<div class="container-fluid">

  <div class="row mt-3">
    <div class="col">
      <h2 th:text="'Miembros del equipo ' + ${equipo.nombre}"></h2>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>Id</th>
          <th>Email</th>
          <th>Nombre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuarioEquipo: ${usuarios}">
          <td th:text="${usuarioEquipo.id}"></td>
          <td th:text="${usuarioEquipo.email}"></td>
          <td th:text="${usuarioEquipo.nombre}"></td>
        </tr>
        </tbody>
      </table>

      <p>
        <a class="btn btn-primary" th:href="@{/equipos}">
          Volver al listado de equipos
        </a>
      </p>
    </div>
  </div>

</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
